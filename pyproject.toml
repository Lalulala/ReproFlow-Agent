[project]
name = "reproflow-agent"
version = "0.1.0"
description = "A reproducible agent workflow for machine-learning experiments and paper evidence."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "ReproFlow contributors" }]
dependencies = [
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
agent = [
  "chromadb>=1.0,<2",
  "jinja2>=3.1,<4",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "matplotlib>=3.9,<4",
  "openai>=1.50,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "pyyaml>=6.0,<7",
  "streamlit>=1.40,<2",
  "typer>=0.15,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reproflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["reproflow"]
omit = ["src/reproflow/ui.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
